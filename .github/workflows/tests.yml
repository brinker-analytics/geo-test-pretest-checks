name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fast tests
        run: pytest -q
      - name: Calibration tests (slow, ~1-2 min)
        run: pytest -q -m slow -s
      - name: Notebook executes end to end
        run: jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb notebooks/pretest_checks.ipynb
